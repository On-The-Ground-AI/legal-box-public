# Build the OTG Legal Box macOS installer (.dmg) on a real macOS runner.
#
# Trigger:
#   - Manually from the "Actions" tab ("Run workflow")
#   - Automatically on pushes to public-main that touch the app
#   - On a v* tag, which additionally publishes a GitHub Release
#
# The workflow runs the same three stages as scripts/build-app.sh:
#   1. Build the React frontend (Vite)
#   2. Compile the Python backend into a standalone binary (PyInstaller)
#   3. Package everything into a .dmg with electron-builder
#
# Artifacts (downloadable from the Actions run page):
#   - OTG-Legal-Box-<version>-mac-arm64.dmg   (Apple Silicon only — see the
#     build step's comment for why Intel is not built here)
#   - The matching .zip (same content, used by electron-updater)
#   - latest-mac.yml, SHA256SUMS-macOS.txt
#
# Builds are UNSIGNED but ad-hoc signed (electron/build/afterPack.js), which
# is what lets them launch at all on Apple Silicon. Gatekeeper still shows
# the unidentified-developer prompt — see INSTALL.md for the one-time step.
#
# Releasing is documented end to end in RELEASING.md.

name: Build macOS DMG

# The default GITHUB_TOKEN is read-only in this org, which is why the v1.0.0
# tag built a perfectly good DMG and then died on the release step with
# "403 Resource not accessible by integration". Creating a release and
# uploading assets to it both need contents: write.
permissions:
  contents: write

on:
  workflow_dispatch:          # lets you click "Run workflow" from the Actions tab
  push:
    branches:
      - public-main           # the repo's default branch
    tags:
      - 'v*'                  # tagged builds publish a GitHub Release below
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'electron/**'
      - 'scripts/build-app.sh'
      - '.github/workflows/build-mac.yml'

jobs:
  build:
    runs-on: macos-14         # Apple Silicon macOS runner (arm64)
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Stage 1 — Frontend ────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Stage 2 — Python backend → PyInstaller binary ─────────────────────
      - name: Create Python venv + install backend dependencies
        working-directory: backend
        run: |
          python3.11 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          # Prefer the large NER model (better recall on Asian names for the
          # PII shield); it is bundled into the backend binary by the spec.
          python -m spacy download en_core_web_lg || python -m spacy download en_core_web_sm
          # Pre-download the embedding model and save it INTO the build tree
          # so the packaged app is fully offline (the backend blocks all
          # non-loopback connections; nothing may fetch at runtime).
          # device='cpu' is required here: this Apple Silicon CI runner has
          # MPS (Metal GPU) available but not enough allocatable GPU memory
          # for it in a virtualized environment, and this step only needs to
          # download + serialize weights to disk — no training or inference
          # speed to protect — so forcing CPU sidesteps the OOM entirely.
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', device='cpu').save('embedding_model')"

      - name: Compile backend with PyInstaller
        working-directory: backend
        run: |
          source venv/bin/activate
          pyinstaller legalbox.spec \
            --distpath "$GITHUB_WORKSPACE/backend-dist" \
            --workpath "$GITHUB_WORKSPACE/.pyinstaller-work" \
            --clean --noconfirm
          chmod +x "$GITHUB_WORKSPACE/backend-dist/legalbox-backend/legalbox-backend"
          ls -la "$GITHUB_WORKSPACE/backend-dist/legalbox-backend" | head -20

      # ── Stage 3 — Electron builder → .dmg ─────────────────────────────────
      - name: Stage bundled Ollama runtime
        working-directory: electron
        run: |
          mkdir -p vendor/ollama
          curl -fsSL -o /tmp/ollama-darwin.tgz "https://ollama.com/download/ollama-darwin.tgz"
          tar -xzf /tmp/ollama-darwin.tgz -C vendor/ollama
          chmod +x vendor/ollama/ollama || true
          ls -la vendor/ollama

      - name: Install electron dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      # mac.target in electron/package.json is arm64-only on purpose, so no
      # CLI override is needed here. The history is worth knowing: this job
      # used to rewrite package.json in place because the --arm64 shorthand
      # does NOT override an explicit arch array, and a run that built both
      # arm64 and x64 DMGs had them race for the same /Volumes/OTG Legal Box
      # staging mount and crash electron-builder. PyInstaller on this runner
      # only ever produces an arm64 backend binary, so an x64 DMG would ship
      # a broken backend regardless — Intel Macs need their own job on their
      # own runner, which this workflow does not attempt.
      - name: Build macOS DMG (arm64 only, unsigned)
        working-directory: electron
        env:
          # Skip Developer ID discovery — there's no Apple cert in CI. The
          # afterPack hook still applies an ad-hoc signature, which macOS on
          # Apple Silicon requires before it will launch the app at all.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # --publish never: electron-builder generates latest-mac.yml but does
        # not upload anything itself; the release step below owns publishing.
        run: npx electron-builder --mac --arm64 --publish never

      - name: List produced artifacts
        run: |
          echo "── dist-electron/ ──"
          ls -lah dist-electron/ || true

      # Lets a firm's IT verify a download matches what CI produced — the
      # whole pitch is confidentiality, so an unsigned build should at least
      # be checksummable.
      - name: Generate SHA256 checksums
        working-directory: dist-electron
        run: |
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macOS.txt
          cat SHA256SUMS-macOS.txt

      # ── Upload the DMGs so you can download them from the Actions tab ─────
      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OTG-Legal-Box-macOS
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/latest-mac.yml
            dist-electron/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 14

      # ── Tagged builds become a GitHub Release (artifacts otherwise expire) ─
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/latest-mac.yml
            dist-electron/SHA256SUMS-macOS.txt
          generate_release_notes: true
          # The Mac and Windows jobs both target the same tag and race to
          # create the release; whichever loses must attach to the existing
          # one rather than fail.
          fail_on_unmatched_files: false
