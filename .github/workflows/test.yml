name: Backend tests

# The PII shield test suite is the release gate for the product's core
# promise: no client PII ever reaches the LLM, and every response restores
# the original values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest hypothesis

      - name: Install spaCy NER model
        run: python -m spacy download en_core_web_sm

      - name: Run test suite
        run: pytest tests/ -q

      - name: PII benchmark (informational)
        run: python tests/benchmark_pii.py
